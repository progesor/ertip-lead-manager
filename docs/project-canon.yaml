project:
  name: Ertip Lead Manager
  type: windows_desktop
  owner: Ertip Medical
  phase: m2_import

v1:
  platform:
    primary: windows_x64
    offline_capable: true
    single_user: true
  ui:
    primary_language: tr
    domain_keys_language_neutral: true
  ingestion:
    mode: manual_file_import
    supported_formats:
      - xlsx
      - csv
    live_google_sheets: false
    meta_api: false
    csv_encoding:
      required: utf8
      allow_bom: true
  storage:
    engine: sqlite
    source_data_immutable: true
    crm_data_separate: true
    timestamps: utc_rfc3339_text
    app_data_location: tauri_app_data_dir
    automatic_retention_deletion: false
  packaging:
    internal_installer: nsis_current_user
    unsigned_internal_build_allowed: true
  identity:
    submission_unique_key: external_lead_id
    contact_match:
      allow_email: true
      allow_phone: true
      allow_name_only: false
      conflict_requires_review: true
  product_interests:
    cardinality: many
    form_mode: multi_select
    canonical_options:
      - FUE_MICROMOTOR_SYSTEMS
      - LONG_HAIR_FUE_SOLUTIONS
      - FUE_PUNCHES
      - IMPLANTERS_FORCEPS_SURGICAL_INSTRUMENTS
      - MEDICAL_CHAIRS_CLINIC_FURNITURE
      - OTHER_GENERAL_INFORMATION
    internal_states:
      - UNKNOWN
    legacy_free_text_supported: true
    preserve_raw_answers: true
    verified_export:
      observed_on: 2026-08-21
      header: which_product_would_you_like_to_receive_more_information_about?
      multi_value_delimiter: "|"
      values_are_machine_slugs: true
      mapping:
        fue_micromotor_systems: FUE_MICROMOTOR_SYSTEMS
        long_hair_fue_solutions: LONG_HAIR_FUE_SOLUTIONS
        fue_punches: FUE_PUNCHES
        "implanters,_forceps_&_surgical_instruments": IMPLANTERS_FORCEPS_SURGICAL_INSTRUMENTS
        "medical_chairs_&_clinic_furniture": MEDICAL_CHAIRS_CLINIC_FURNITURE
        "other_products_/_general_information": OTHER_GENERAL_INFORMATION
  ignored_source_columns:
    - Status
    - İletişime Geçme Tarihi
  source_metadata_columns:
    lead_status: preserve_raw_only
  statuses:
    - NEW
    - CONTACTED
    - REPLIED
    - QUALIFIED
    - QUOTE_SENT
    - WON
    - LOST
    - INVALID
  modules:
    - import_preview
    - import_history
    - leads
    - lead_detail
    - pipeline
    - notes
    - activities
    - follow_ups
    - product_normalization
    - data_quality
    - dashboard
    - analytics
    - backup_restore
  excluded:
    - google_sheets_sync
    - meta_leads_api
    - meta_ads_spend_api
    - whatsapp_api
    - email_sending
    - odoo
    - cloud_database
    - multi_user
    - authentication
    - mobile
    - ai_required_features

technology:
  shell: tauri_2
  frontend: react_typescript_vite
  backend: rust
  database: sqlite
  database_access: sqlx
  xlsx_parser: calamine
  csv_parser: rust_csv
  validation: zod
  table: tanstack_table
  charts: recharts

data:
  timestamps: utc_persist_local_display
  preserve_source_timestamp: true
  preserve_raw_payload: true
  real_pii_in_repository: forbidden
