name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production frontend build
        run: npm run build

  rust:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  server:
    name: Server tests (Linux + PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: elm
          POSTGRES_PASSWORD: elm
          POSTGRES_DB: elm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elm -d elm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELM_TEST_DATABASE_URL: postgres://elm:elm@localhost:5432/elm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Server cargo tests and PostgreSQL migration gate
        run: cargo test --manifest-path server/Cargo.toml -- --test-threads=1

  server-container:
    name: Server container build
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - name: Build Coolify server image
        run: docker build -f server/Dockerfile -t ertip-lead-manager-server:ci .

  windows-package:
    name: Tauri debug package (Windows)
    runs-on: windows-latest
    needs: [frontend, rust, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build debug NSIS package
        run: npm run tauri:build -- --debug
