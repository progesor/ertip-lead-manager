name: Local Release v0.1.0

on:
  push:
    branches: ["release/local-v0.1.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-release-v0.1.0
  cancel-in-progress: true

jobs:
  windows-release:
    name: Windows x64 release installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend release gate
        run: npm run check

      - name: Rust release gate
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build optimized NSIS release
        run: npm run tauri:build

      - name: Create release metadata and SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii RELEASE_SHA256.txt

          @"
          Ertip Lead Manager Local Release
          Release: v0.1.0-local
          App Version: 0.1.0
          Target: Windows x64 / NSIS current-user installer
          Commit: $env:GITHUB_SHA
          Workflow Run: $env:GITHUB_RUN_ID
          Installer: $($installer.Name)
          SHA256: $hash
          "@ | Set-Content -Encoding utf8 RELEASE_INFO.txt

          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA256: $hash"

      - name: Upload local release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ertip-lead-manager-v0.1.0-local-win-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            RELEASE_SHA256.txt
            RELEASE_INFO.txt
          if-no-files-found: error
          retention-days: 90
